<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photodetectors</title>
<style>

:root{
  --bg:#0c1016; --card:#141a22; --card2:#10151c; --line:#243041; --text:#e6edf3; --muted:#8b98a9;
  --thr:#4aa8ff; --refl:#d58cff; --fw:#5fd38d; --bw:#ff8f6b; --accent:#ffcc66; --laser:#ff4d6d; --warn:#ff6b6b;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;padding:14px 20px 6px}
header h1{font-size:19px;margin:0;font-weight:650}
header .sub{color:var(--muted);font-size:13px}
main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;padding:10px 20px 20px}
@media (max-width:1100px){main{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px;font-weight:600}
.view{height:min(54vh,560px);min-height:380px;display:flex;flex-direction:column}
.view canvas{flex:1;width:100%;min-height:0;display:block;border-radius:8px}
#c3d{background:radial-gradient(ellipse at 50% 35%,#18212d 0%,#0d1218 75%);cursor:grab;touch-action:none}
#c3d:active{cursor:grabbing}
#cPlot{background:var(--card2);cursor:crosshair;touch-action:none}
#cP2{background:var(--card2);height:240px;width:100%;display:block;border-radius:8px;cursor:crosshair;touch-action:none}
.toolbar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:8px;font-size:13px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:transparent;color:var(--muted);border:0;padding:4px 10px;font:inherit;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:#223046;color:var(--text)}
.toolbar label{display:inline-flex;align-items:center;gap:5px;cursor:pointer}
input[type=number]{background:#0f141b;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:3px 6px;font:inherit;width:86px}
.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.group{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.group h3{margin:0 0 6px;font-size:13px;font-weight:600;color:var(--accent)}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 8px;margin:7px 0}
.row.off{opacity:.35;pointer-events:none}
.row .lab{color:var(--muted);font-size:12.5px}
.row .val{font-variant-numeric:tabular-nums;font-size:12.5px;text-align:right}
.row input[type=range]{grid-column:1/3;width:100%;accent-color:var(--accent);margin:2px 0 0}
.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0;font-size:12.5px;color:var(--muted)}
.btn{background:#1d2735;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:4px 10px;font:inherit;font-size:12.5px;cursor:pointer}
.btn:hover{background:#26344a}
.btn.primary{border-color:#6b5a2b;background:#2d2615;color:var(--accent)}
.readouts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:10px}
.ro{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.ro .k{font-size:11.5px;color:var(--muted)}
.ro .v{font-size:15.5px;font-variant-numeric:tabular-nums;font-weight:600}
.ro .v small{font-size:12px;color:var(--muted);font-weight:500}
.span2{grid-column:1/-1}
/* theory */
.theory{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:14px}
.th{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.th h3{margin:0 0 8px;font-size:14px;color:var(--accent)}
.th p{margin:6px 0;color:#c9d3de;font-size:13px}
.eq{display:block;text-align:center;line-height:2.4;margin:8px 0;font:15px "Cambria Math","STIX Two Math","Times New Roman",serif;color:#eef3f8}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 3px}
.frac>span:first-child{border-bottom:1px solid #cfd8e3;padding:0 4px 2px}
.frac>span:last-child{padding:2px 4px 0}
.live{font:600 12.5px ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--accent);background:#1f1a0e;border:1px solid #4a3d1c;border-radius:5px;padding:1px 6px;white-space:nowrap}
table.fm{width:100%;border-collapse:collapse;font-size:13px}
table.fm td{padding:5px 6px;border-bottom:1px solid #1f2836;color:#c9d3de;vertical-align:middle}
table.fm td.f{font:14px "Cambria Math","STIX Two Math","Times New Roman",serif;color:#eef3f8}
table.fm td.f small{display:block;font:11.5px system-ui,sans-serif;color:var(--muted)}
table.fm td:last-child{text-align:right}
i.v{font-family:"Cambria Math","Times New Roman",serif;font-style:italic}
a.back{color:#ffcc66;text-decoration:none;font-size:13px;border:1px solid #4a3d1c;background:#1f1a0e;border-radius:8px;padding:3px 10px;margin-right:4px}a.back:hover{background:#2d2615}

.row .val{display:flex;align-items:center;justify-content:flex-end;gap:4px;text-align:right}
.numin{width:78px;background:#0f141b;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font:inherit;font-size:12.5px;text-align:right;font-variant-numeric:tabular-nums}
.numin:focus{outline:none;border-color:var(--accent)}
.row .unit{color:var(--muted);font-size:12px;min-width:18px;text-align:left}
.row .extra{color:var(--muted);font-size:11.5px;white-space:nowrap}
.cfgsel{background:#1f1a0e;color:var(--accent);border:1px solid #6b5a2b;border-radius:9px;padding:6px 10px;font:inherit;font-size:13.5px;cursor:pointer}

.smat{display:inline-grid;grid-template-columns:auto auto;gap:2px 14px;padding:2px 9px;vertical-align:middle;border-left:1.5px solid #cfd8e3;border-right:1.5px solid #cfd8e3;border-radius:7px;line-height:1.7;text-align:center}

.cfgbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:4px 20px 2px;font-size:13px;color:var(--muted)}
#frame{display:block;width:100%;height:1800px;border:0;background:var(--bg)}
</style>
</head>
<body>
<header>
  <a class="back" href="../index.html">← Component catalog</a>
  <h1>Photodetectors</h1>
  <span class="sub" id="sub"></span>
</header>
<nav class="cfgbar">
  <span>Detector</span>
  <select id="selDet" class="cfgsel">
    <option value="pin">Photodetector · Ge-on-Si PIN photodiode</option>
    <option value="bal">Balanced photodetector</option>
    <option value="coh">Coherent detection with a 90° hybrid</option>
  </select>
</nav>
<iframe id="frame" title="Photodetector simulation"></iframe>
<script>
const DET = {
  pin: { src: 'pd-pin.html', sub: 'Absorption, responsivity, dark current, bandwidth and noise of a vertical PIN Ge-on-Si photodiode. Part of the Programmable Photonics interactive lab.' },
  bal: { src: 'pd-bal.html', sub: 'Two photodiodes in series: subtraction of photocurrents, common-mode rejection, laser-noise cancellation and interferometric detection with a local oscillator. Part of the Programmable Photonics interactive lab.' },
  coh: { src: 'pd-coh.html', sub: 'Signal and local oscillator mixed in a 2×4 hybrid and detected by two balanced photodetectors: recovering the full field (I and Q). Part of the Programmable Photonics interactive lab.' }
};
const frame = document.getElementById('frame'), sel = document.getElementById('selDet');
function show(k) {
  if (!DET[k]) k = 'pin';
  sel.value = k; document.getElementById('sub').textContent = DET[k].sub;
  frame.src = DET[k].src + '?embed=1';
  if (location.hash.slice(1) !== k) history.replaceState(null, '', '#' + k);
}
sel.onchange = () => show(sel.value);
window.addEventListener('message', e => { if (e.data && e.data.ppH) frame.style.height = (e.data.ppH + 4) + 'px'; });
window.addEventListener('hashchange', () => show(location.hash.slice(1)));
show(location.hash.slice(1));
</script>
</body>
</html>
